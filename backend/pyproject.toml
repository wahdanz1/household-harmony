[project]
name = "household-harmony-backend"
version = "1.0.0"
description = "Backend API for Household Harmony with Swedish tax intelligence"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "supabase>=2.9.0",
    "python-dotenv>=1.0.1",
    "pyjwt>=2.15.1",
    "pdfplumber>=0.11.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.21",
    "cryptography>=46.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "pytest-asyncio>=1.3.0",
]
