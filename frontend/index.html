<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

  <!-- script-src hash below pins the inline theme script. Regenerate on edit. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'sha256-qZFQHHsWZii+WmLPYodMObOdwMt/M25UxUr9XO78dYA=';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: https:;
    connect-src 'self' https://*.supabase.co https://api.groq.com https://generativelanguage.googleapis.com https://*.railway.app;
    base-uri 'self';
    form-action 'self';
  " />

  <title>Household Harmony - Track, plan & save!</title>
  <meta name="description"
    content="Streamlined household economy management for couples and families. Track shared finances with minimal effort." />
  <meta name="author" content="Household Harmony" />

  <meta property="og:title" content="Household Harmony - Track, plan & save!" />
  <meta property="og:description"
    content="Streamlined household economy management for couples and families. Track shared finances with minimal effort." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/preview-image.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Household Harmony - Track, plan & save!" />
  <meta name="twitter:description"
    content="Streamlined household economy management for couples and families. Track shared finances with minimal effort." />
  <meta name="twitter:image" content="/preview-image.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" />

  <script>
    // Apply theme before paint to avoid FOUC
    (function () {
      try {
        var saved = localStorage.getItem('hh-theme');
        var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
